    <title>Puja Form</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-100 py-10">
    
    
    
    <!-- Google Tag Manager (noscript) -->

   <!-- WhatsApp Chat Icon -->

   <a href="https://wa.me/+916263635078?text=Hi%2C%20I%20want%20to%20know%20more%20about%20Mangal%20Dosh%20Puja" target="_blank" class="fixed bottom-6 right-6 bg-green-500 p-3 rounded-full shadow-lg  transition-all">
    <img src="https://upload.wikimedia.org/wikipedia/commons/6/6b/WhatsApp.svg" alt="WhatsApp" class="h-8 w-8 text-white">
  </a>

  

    <!-- Right Side: Form -->
    <div class="max-w-3xl mx-auto bg-white shadow-lg rounded-lg p-8">
        <form  id="pujaForm" class="space-y-6"   onsubmit="sendEmail(event)">
            <!-- Name -->
            <div>
                <label for="name" class="block text-sm font-medium text-gray-700">Name</label>
                <input type="text" id="name" name="name" placeholder="Enter your name"
                    class="w-full p-3 border border-gray-300 rounded focus:ring-2 focus:ring-blue-500">
                <p id="nameError" class="text-red-500 text-sm mt-1 hidden">Name is required.</p>
            </div>

            <!-- Mobile Number -->
            <div>
                <label for="mobile" class="block text-sm font-medium text-gray-700">Mobile Number</label>
                <input type="text" id="mobile" name="mobile" placeholder="Enter your mobile number"
                    class="w-full p-3 border border-gray-300 rounded focus:ring-2 focus:ring-blue-500">
                <p id="mobileError" class="text-red-500 text-sm mt-1 hidden">Enter a valid 10-digit mobile number.</p>
            </div>

            <!-- Email -->
            <div>
                <label for="email" class="block text-sm font-medium text-gray-700">Email</label>
                <input type="email" id="email" name="email" placeholder="Enter your email"
                    class="w-full p-3 border border-gray-300 rounded focus:ring-2 focus:ring-blue-500">
                <p id="emailError" class="text-red-500 text-sm mt-1 hidden">Enter a valid email address.</p>
            </div>

            <!-- Select Puja -->
            <div>
                <label for="puja" class="block text-sm font-medium text-gray-700">Select Puja</label>
                <select id="puja"  name="puja"
                    class="w-full p-3 border border-gray-300 rounded focus:ring-2 focus:ring-blue-500">
                    <option value="" disabled selected>Select a Puja</option>
                    <option value="kalsarp">Kalsarp Dosh Puja</option>
                    <option value="mangal">Mangal Dosh Puja</option>
                    <option value="mahamrityunjay">Mahamrityunjay Jaap</option>
                    <option value="navgraha">Navgraha Puja</option>
                    <option value="rudrabhishek">Rudrabhishek</option>
                    <option value="grahshanti">Grah Shanti Puja</option>
                    <option value="vastu">Vastu Shanti Puja</option>
                    <option value="shivabhishek">Shiv Abhishek Puja</option>
                    <option value="special">Special Pujas</option>
                </select>
                <p id="pujaError" class="text-red-500 text-sm mt-1 hidden">Please select a Puja.</p>
            </div>

            <!-- Submit Button -->
            <button type="submit"
                class="w-full bg-blue-600 text-white py-3 rounded-lg hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-blue-500">
                Submit
            </button>
        </form>
    </div>

    <!-- Script for Validation -->
    <script>
    const menuBtn = document.getElementById('menu-btn');
    const menu = document.getElementById('menu');
    const mobileMenu = document.getElementById('mobile-menu');

    menuBtn.addEventListener('click', () => {
      mobileMenu.classList.toggle('hidden');
    });




    function sendEmail(event) {
    event.preventDefault(); // Prevent default form submission behavior

    const form = document.getElementById("pujaForm");

    const name = encodeURIComponent(form.name.value);
    const mobile = encodeURIComponent(form.mobile.value);
    const email = encodeURIComponent(form.email.value);
    const puja = encodeURIComponent(form.puja.value);

    // Construct the mailto link
    const mailtoLink = `mailto: ramlakhansharma8319@gmail.com?subject=Puja Booking&body=Name: ${name}%0AMobile: ${mobile}%0AEmail: ${email}%0APuja: ${puja}`;

    // Open the user's email client
    window.location.href = mailtoLink;
  }

    </script>

</body>

</html>
