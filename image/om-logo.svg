<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" role="img" aria-labelledby="title desc">
  <title id="title">Om Symbol</title>
  <desc id="desc">Local Om logo used in the Ujjain Pandit website header.</desc>
  <defs>
    <linearGradient id="bg" x1="0%" x2="100%" y1="0%" y2="100%">
      <stop offset="0%" stop-color="#dbeafe" />
      <stop offset="100%" stop-color="#bfdbfe" />
    </linearGradient>
    <linearGradient id="text" x1="0%" x2="100%" y1="0%" y2="100%">
      <stop offset="0%" stop-color="#1d4ed8" />
      <stop offset="100%" stop-color="#1e40af" />
    </linearGradient>
  </defs>
  <rect width="160" height="160" rx="36" fill="url(#bg)" />
  <circle cx="80" cy="80" r="60" fill="#ffffff" opacity="0.92" />
  <text x="80" y="96" text-anchor="middle" font-family="Georgia, serif" font-size="54" font-weight="700" fill="url(#text)">Om</text>
</svg>
